<VirtualHost *:80>
    ServerName YOUR_DOMAIN.com
    ServerAlias www.YOUR_DOMAIN.com

    DocumentRoot /var/www/YOUR_DOMAIN.com/public_html

    <Directory /var/www/YOUR_DOMAIN.com/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/YOUR_DOMAIN-error.log
    CustomLog ${APACHE_LOG_DIR}/YOUR_DOMAIN-access.log combined

    # Redirect to HTTPS (uncomment after SSL is configured)
    # RewriteEngine On
    # RewriteCond %{HTTPS} off
    # RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

